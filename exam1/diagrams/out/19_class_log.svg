ont-family="Arial">+valueAfter : int {readOnly}</text></g><g class="entity" data-qualified-name="GMN17" id="ent0018" data-source-line="54"><path d="M136,9 L136,50.947 A3,3 0 0 0 139,53.947 L330.704,53.947 A3,3 0 0 0 333.704,50.947 L333.704,16 L323.704,6 L139,6 A3,3 0 0 0 136,9" style="stroke:#BFA640;stroke-width:0.5;" fill="#FFF9E0"/><path d="M323.704,6 L323.704,14.5 A1.5,1.5 0 0 0 325.204,16 L333.704,16 L323.704,6" style="stroke:#BFA640;stroke-width:1;" fill="#FFF9E0"/><text x="142" y="21.318" fill="#000" font-size="11" textLength="176.704" font-family="Arial">Append-only; entries are immutable,</text><text x="142" y="33.967" fill="#000" font-size="11" textLength="141.228" font-family="Arial">so copy() only copies the list.</text><text x="142" y="46.616" fill="#000" font-size="11" textLength="166.294" font-family="Arial">toText() returns one line per entry.</text></g><g class="entity" data-qualified-name="GMN20" id="ent0021" data-source-line="60"><path d="M855,123 L855,228.191 A3,3 0 0 0 858,231.191 L1074.416,231.191 A3,3 0 0 0 1077.416,228.191 L1077.416,130 L1067.416,120 L858,120 A3,3 0 0 0 855,123" style="stroke:#BFA640;stroke-width:0.5;" fill="#FFF9E0"/><path d="M1067.416,120 L1067.416,128.5 A1.5,1.5 0 0 0 1068.916,130 L1077.416,130 L1067.416,120" style="stroke:#BFA640;stroke-width:1;" fill="#FFF9E0"/><text x="861" y="135.318" fill="#000" font-size="11" textLength="195.626" font-family="Arial">Every subclass implements toText() and</text><text x="861" y="147.967" fill="#000" font-size="11" textLength="190.765" font-family="Arial">all attributes are {readOnly}. Examples:</text><text x="861" y="160.616" fill="#000" font-size="11" textLength="65.887" font-family="Arial">"Battle starts"</text><text x="861" y="173.265" fill="#000" font-size="11" textLength="169.216" font-family="Arial">"Turn passed to player 1 (Human)"</text><text x="861" y="185.914" fill="#000" font-size="11" textLength="201.416" font-family="Arial">"Unit B uses Action X2 and did 3 damage</text><tex